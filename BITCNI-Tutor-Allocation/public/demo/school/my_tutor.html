    <script>
        console.log("hello this works ig not?");
        //printTable("SELECT sch.schoolID AS 'School ID', sch.schoolName AS 'School Name', sch.schoolPostcode, sch.schoolEmail, sch.schoolTelephone FROM tblSchool sch WHERE sch.schoolID > 0;","#schoolAssignedTutors");


        let presentSchoolSelection = async (schoolID) => {
            let result = await runSQL(`SELECT sch.schoolID, sch.schoolName, sch.schoolPostcode,
         sch.schoolEmail, sch.schoolTelephone FROM tblSchool sch WHERE sch.schoolID = ${schoolID};`);
            let chosenSchoolElement = document.querySelector("#chosenSchoolDetails");
            chosenSchoolElement.appendChild(createObjectDl(result.data[0]));
            const button = document.createElement("button");
                button.textContent = "Choose Another School";
                button.addEventListener("click", () => {
                    window.location.href = "index.html";
                });
            chosenSchoolElement.appendChild(document.createElement("br"));
            chosenSchoolElement.appendChild(button);

        };

        document.addEventListener("DOMContentLoaded", async () => {
            //printTablePages("SELECT t.tutorID, t.tutorName, t.tutorTelephone, t.tutorEmail, t.tutorStatus, r.requestedEducationLevel FROM tblTutor t JOIN tblAssignment a ON t.tutorID = a.tutorID JOIN tblRequest r ON a.requestID = r.requestID WHERE r.schoolID = 1001;", 5,true,"#tutorTable");
            let sqlQuery = "SELECT tu.tutorId AS 'ID',CONCAT(tu.tutorFName,' ',tu.tutorLName) AS 'Tutor Name',tu.tutorEmail AS 'Email',tu.tutorTelephone AS 'Telephone',tu.tutorStatus AS 'Status',tu.tutorEduLevel AS 'Education Level' ,sub.subjectName AS 'Subject', asg.assignmentDateCreated AS 'Date Assigned', asg.assignmentDateClosed AS 'Date Closed' FROM tblAssignment asg INNER JOIN tblRequest req ON asg.requestID = req.requestID INNER JOIN tblSchool sch ON sch.schoolID = req.schoolID INNER JOIN tblTutor tu ON tu.tutorId = asg.tutorID LEFT JOIN tblSubject sub ON req.subjectID = sub.subjectID";
            let sqlQueryWhere = "";
            const schoolSelection = getSchoolSelection();
            if(schoolSelection !== null && schoolSelection.schoolID !== undefined) {
            await presentSchoolSelection(getSchoolSelection().schoolID);
            sqlQueryWhere = ` WHERE sch.schoolID = ${schoolSelection.schoolID}`;
            const myTutorsElement = document.querySelector("#myTutors");
            const header = document.createElement("h2");
            header.textContent = "My Tutors Table";
            const message = document.createElement("p");
            message.textContent = "These are the tutors that are assigned to your school.";
            const tableDiv = document.createElement("div");
            tableDiv.id = "tutorTable";
            const result = await runSQL(sqlQuery+sqlQueryWhere+";");
            const resultSuccess = await runWriteSQL(sqlQuery+sqlQueryWhere+";");
            if(result !== undefined && result.data.length > 0) {
            myTutorsElement.appendChild(header);
            myTutorsElement.appendChild(document.createElement("br"));
            myTutorsElement.appendChild(message);
            myTutorsElement.appendChild(tableDiv);
            printTablePages(sqlQuery+sqlQueryWhere+";", 10, false, "#tutorTable");
            } else if(resultSuccess === true){
                const feedbackElement = document.querySelector("#feedbackDiv");
                feedbackElement.classList.add("errorMessage");
                const message = document.createElement("p");
                message.textContent = "Your school has no assigned tutors to be displayed.";
                feedbackElement.appendChild(message);
                feedbackElement.appendChild(document.createElement("br"));
                const button = document.createElement("button");
                button.textContent = "Return to Home Page";
                button.addEventListener("click", () => {
                    window.location.href = "index.html";
                });
                feedbackElement.appendChild(button);
            } else {
                const feedbackElement = document.querySelector("#feedbackDiv");
                feedbackElement.classList.add("errorMessage");
                const message = document.createElement("p");
                message.textContent = "Error unable to fetch tutors from database";
                feedbackElement.appendChild(message);
                feedbackElement.appendChild(document.createElement("br"));
                const button = document.createElement("button");
                button.textContent = "Return to Home Page";
                button.addEventListener("click", () => {
                    window.location.href = "index.html";
                });
                feedbackElement.appendChild(button);

            }
            } else {
                const feedbackElement = document.querySelector("#feedbackDiv");
                feedbackElement.classList.add("errorMessage");
                const message = document.createElement("p");
                const button = document.createElement("button");
                button.textContent = "Return to Home Page";
                message.textContent = "Please select a school from the schools home page before visiting this page.";
                feedbackElement.appendChild(message);
                feedbackElement.appendChild(document.createElement("br"));
                feedbackElement.appendChild(button);
